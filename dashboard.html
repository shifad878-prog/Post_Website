<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashbaord</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap.css">
</head>

<body>
    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center fw-bold text-warning fs-3" href="index.html">
                BLOG
            </a>

            <!-- Mobile Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">

                <!-- Links -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Blog
                        </a>

                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="single-post.html">
                                    Single Post
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="create-post.html">
                                    Create Post
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="#">
                                    My Posts
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="./about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="./contact.html">
                            Contact
                        </a>
                    </li>

                </ul>


                <!-- Buttons -->
                <div class="d-flex gap-2 align-items-center">

                    <a href="./mypost.html" class="btn btn-outline-warning">
                        My Post
                    </a>

                    <a href="./mypost.html" class="btn btn-warning" id="logoutBtn">
                        Logout
                    </a>


                    <!-- User Profile -->
                    <div class="dropdown">

                        <!-- Profile Button -->
                        <button class="btn bg-transparent border-0 d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">

                            <!-- User Initial -->
                            <span id="userInitial"
                                class="rounded-circle bg-warning text-white fw-bold d-flex align-items-center justify-content-center"
                                style="width: 35px; height: 35px;">
                            </span>

                            <!-- User Name -->
                            <span id="userName" class="fw-semibold">
                            </span>

                        </button>


                        <!-- Dropdown -->
                        <ul class="dropdown-menu dropdown-menu-end shadow">

                            <li class="px-3 py-2">
                                <small class="text-muted">
                                    Signed in as
                                </small>
                            </li>

                            <li>
                                <h6 class="dropdown-header text-dark" id="profileName">
                                </h6>
                            </li>

                            <li>
                                <span class="dropdown-item-text text-muted small" id="userEmail">
                                </span>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <a class="dropdown-item" href="my-posts.html">
                                    My Posts
                                </a>
                            </li>

                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </nav>

    <!-- CREATE POST SECTION -->
    <section class="py-5 shadow">
        <div class="container shadow">
            <div class="row justify-content-center">
                <div class="col-lg-8"> <!-- Heading -->
                    <div class="text-center mb-4">
                        <h1 class="fw-bold text-warning"> Create a Blog Post </h1>
                        <p class="text-muted"> Share your thoughts, ideas and stories with the world. </p>
                    </div> <!-- Create Post Card -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-md-5"> <!-- Blog Cover Image -->
                            <div class="mb-4"> <label class="form-label fw-semibold"> Blog Cover Image </label>
                                <!-- Upload Area --> <label for="coverImage" class="cover-upload-area">
                                    <div class="upload-icon"> <i class="bi bi-cloud-arrow-up"></i> </div>
                                    <h5 class="fw-semibold mb-2"> Drop your image here or browse </h5>
                                    <p class="text-muted mb-1"> Upload a cover image for your blog post </p> <small
                                        class="text-muted"> PNG, JPG or JPEG </small>
                                </label> <!-- File Input --> <input type="file" id="coverImage" accept="image/*" hidden>
                                <!-- Upload Button --> <button type="button" class="btn btn-warning mt-3"
                                    id="uploadImageBtn"> <i class="bi bi-upload"></i> Upload Image </button>
                                <!-- Image Preview -->
                                <div id="coverPreviewBox" class="mt-3 d-none"> <img id="coverPreview" src=""
                                        alt="Cover Preview" class="img-fluid rounded shadow-sm"
                                        style="width: 100%; height: 300px; object-fit: cover;"> </div>
                            </div> <!-- Title -->
                            <div class="mb-4"> <label for="postTitle" class="form-label fw-semibold"> Post Title
                                </label> <input type="text" class="form-control form-control-lg" id="postTitle"
                                    placeholder="Enter your post title"> </div> <!-- Category -->
                            <div class="mb-4"> <label for="postCategory" class="form-label fw-semibold"> Category
                                </label> <select class="form-select" id="postCategory">
                                    <option value="" selected> Select Category </option>
                                    <option value="Technology"> Technology </option>
                                    <option value="Programming"> Programming </option>
                                    <option value="Education"> Education </option>
                                    <option value="Lifestyle"> Lifestyle </option>
                                    <option value="Travel"> Travel </option>
                                    <option value="Business"> Business </option>
                                </select> </div> <!-- Content -->
                            <div class="mb-4"> <label for="postContent" class="form-label fw-semibold"> Blog Content
                                </label> <textarea class="form-control" id="postContent" rows="10"
                                    placeholder="Write your blog post here..."></textarea> </div> <!-- Buttons -->
                            <div class="d-flex gap-2 justify-content-end"> <button type="button"
                                    class="btn btn-outline-secondary" id="cancelPostBtn"> Cancel </button> <button
                                    type="button" class="btn btn-warning px-4" id="createPostBtn"> Publish Post
                                </button> </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    </div>

    </div>

    </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
